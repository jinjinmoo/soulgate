/* Layout: a 2009 browser-game frame — slate header strip, lavender data tables, one central play window. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --night:#191c24; --slate:#232833; --panel:#2c3341; --panel2:#353d4d; --line:#454f63;
  --lav:#c4c2e2; --lav-row:#b2b0d6; --lav-row2:#cfcdea; --lav-ink:#1c1b31; --lav-head:#3d3b6b;
  --ink:#ebe9f6; --muted:#9ea5b8; --soul:#7fe6d2; --soul-dim:#3f8f84; --gold:#f2c96b;
  --safe:#5fd17a; --warn:#5aa9ff; --crit:#ff5a5a;
  --f-display:'Pixelbasel','Courier New',monospace;
  --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{height:100%}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 20% -10%,#2b2f4a 0,transparent 55%),radial-gradient(circle at 110% 30%,#1f3a3a 0,transparent 45%);
  background-attachment:fixed;min-height:100vh;margin:0}
.shell{max-width:1320px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
kbd{font-family:var(--f-data);font-size:11px;background:var(--night);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted);margin-left:6px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--slate);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:12px 16px}
.logo{font-family:var(--f-display);font-weight:400;font-size:48px;letter-spacing:.06em;line-height:1;color:var(--soul);text-shadow:3px 3px 0 #0b0d12, 0 0 18px rgba(127,230,210,.35)}
.logo small{display:block;font-family:var(--f-data);font-size:11px;letter-spacing:.18em;color:var(--muted);text-shadow:none;margin-top:4px;font-weight:400}
.stats{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-data);font-size:13px}
.stats b{color:var(--gold);font-weight:600}
.stat-l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block}
.nav{display:flex;flex-wrap:wrap;gap:2px;background:#11141a;border:1px solid var(--line);border-top:0;padding:0 8px}
.nav button{background:none;border:0;padding:8px 14px;font-family:var(--f-display);font-size:24px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.nav button:hover:not(:disabled){color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--soul)}
.nav button.hunt{color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.fieldbar{margin-left:auto;align-self:center;font-family:var(--f-data);font-size:13px;color:var(--soul);padding:6px 4px}
.fieldbar.low{color:var(--crit)}
main{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:20px}

h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:32px}
h2{font-size:24px;margin-bottom:10px}
h3{font-size:16px;margin-bottom:6px;color:var(--soul);text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 10px;max-width:68ch}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--soul);color:#0d2420;border-color:var(--soul);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--soul)}
.btn:active:not(:disabled){transform:translateY(1px);border-bottom-width:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--soul);color:#0d2420;border-color:#3fae9b}
.btn.gold{background:var(--gold);color:#2b1f05;border-color:#b8903b}
.btn.danger{background:#5a2328;border-color:#8a3a41}
.btn.small{padding:3px 9px;font-size:12px;border-bottom-width:2px}
.btn kbd{background:rgba(0,0,0,.25);color:inherit;border-color:rgba(0,0,0,.3)}
a.link{color:var(--soul);cursor:pointer;text-decoration:underline}

/* lavender tables, a nod to the original's look */
.tbl-wrap{overflow-x:auto;border-radius:4px;border:1px solid #6d6aa3}
table.lav{width:100%;border-collapse:collapse;background:var(--lav);color:var(--lav-ink);font-size:13px}
table.lav th{background:var(--lav-head);color:#fff;text-align:left;font-weight:700;padding:6px 10px;font-size:12px;letter-spacing:.04em}
table.lav td{padding:5px 10px;border-top:1px solid rgba(28,27,49,.12);vertical-align:middle}
table.lav tr:nth-child(even) td{background:var(--lav-row2)}
table.lav .num{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.lav .you td{background:#f2e3a8!important;font-weight:700}
table.lav .btn{color:var(--ink)}
.r-6{color:#9a5a00;font-weight:700}.r-5{color:#0f6b5e;font-weight:700}.r-4{color:#8a1f5a;font-weight:700}.r-3{color:#1f3b8a;font-weight:700}.r-2{color:#2e6b1f;font-weight:700}
button.sorth{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
button.sorth:hover{text-decoration:underline}
.tier{font-weight:700}
.t-low{color:#5b5a76}.t-reg{color:#1f3b8a}.t-boss{color:#8a1f5a}.t-bru{color:#a8420a}.t-leg{color:#9a5a00}.t-perf{color:#b00f0f}
/* same tiers, tuned for dark panels */
.slot .t-low,.box .t-low{color:var(--muted)}.slot .t-reg,.box .t-reg{color:#a9bcff}.slot .t-boss,.box .t-boss{color:#ff93d6}.slot .t-leg,.box .t-leg{color:var(--gold)}.slot .t-perf,.box .t-perf{color:#ff7a7a}.slot .t-bru,.box .t-bru{color:#ffa86b}

 --r0:#a3a8b8;--r1:#7fd38a;--r2:#6fd6e0;--r3:#7fa6ff;--r4:#c08cff;--r5:#ff8fcf;--r6:#f2c96b;
 --r0-l:#4d4c66;--r1-l:#1e5a28;--r2-l:#0a5560;--r3-l:#1f3b8a;--r4-l:#5b2a9e;--r5-l:#8a1f5a;--r6-l:#6e4300}
.r-0{color:var(--r0)}.r-1{color:var(--r1);font-weight:700}.r-2{color:var(--r2);font-weight:700}.r-3{color:var(--r3);font-weight:700}.r-4{color:var(--r4);font-weight:700}.r-5{color:var(--r5);font-weight:700}.r-6{color:var(--r6);font-weight:700}

const spriteCache={};
function makeSprite(sid){
 if(spriteCache[sid])return spriteCache[sid];
 const sp=SPECIES[sid];const r=mulberry(sp.seed);const pal=EL[sp.el].c;
 const N=[10,12,16,20,24][sp.size];const half=N/2;const g=[];
 for(let y=0;y<N;y++){g.push([]);for(let x=0;x<half;x++){
  const ax=(half-1-x)/half, ay=Math.abs(y-N*0.5)/N;
  g[y][x]=r()<(0.92-ax*0.75-ay*0.9+(y>N*0.75?-0.1:0))?1:0;}}
 for(let y=1;y<N-1;y++)for(let x=0;x<half;x++){ // prune lone cells
  let n=0;[[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{const xx=x+dx,yy=y+dy;const v=xx>=half?g[yy][half-1-(xx-half)]:xx<0?0:g[yy][xx];n+=v||0});
  if(g[y][x]&&n===0)g[y][x]=0;if(!g[y][x]&&n>=3)g[y][x]=1;}
 const full=(x,y)=>{if(y<0||y>=N||x<0||x>=N)return 0;return x<half?g[y][x]:g[y][N-1-x]};
 const c=document.createElement('canvas');c.width=N+2;c.height=N+2;const ctx=c.getContext('2d');
 for(let y=-1;y<=N;y++)for(let x=-1;x<=N;x++){
  let col=null;
  if(full(x,y)){col=!full(x,y-1)?pal[0]:!full(x,y+1)?pal[2]:pal[1];
   if(((x*7+y*13+sp.seed)%11)===0)col=pal[2];}
  else if(full(x+1,y)||full(x-1,y)||full(x,y+1)||full(x,y-1))col='#0b0d12';
  if(col){ctx.fillStyle=col;ctx.fillRect(x+1,y+1,1,1)}}
 // eyes
 for(let y=Math.floor(N*.25);y<Math.floor(N*.55);y++){const ex=half-2-Math.floor(r()*Math.max(1,half-3));
  if(full(ex,y)&&full(ex,y-1)&&full(ex,y+1)){ctx.fillStyle='#fff';ctx.fillRect(ex+1,y+1,1,1);ctx.fillRect(N-ex,y+1,1,1);
   ctx.fillStyle='#0b0d12';ctx.fillRect(ex+1,y+2,1,1);ctx.fillRect(N-ex,y+2,1,1);break}}
 spriteCache[sid]=c;return c;}

function newDay(first){
 if(!S.cache)newCache();if(!first)npcOpenCaches();
 const caughtSp=Object.keys(S.bestiary||{}).filter(x=>SPECIES[x]);const src=caughtSp.length>=3?caughtSp:(unlockedSpecies().length?unlockedSpecies():regionSpecies());const pool=[...new Set(src.flatMap(s=>SPECIES[s].genes.split('')))];
 let key='';const owned=pool.filter(c=>(S.genes[c]||0)>0);const KL=geneKeyLen(),miss=S.stats&&S.stats.trips<25?1:2;if(owned.length>=2){const cnt={};let g=0;while(key.length<KL-miss&&g++<80){const c=pick(owned);if((cnt[c]||0)<S.genes[c]){cnt[c]=(cnt[c]||0)+1;key+=c}}const unowned=pool.filter(c=>!(S.genes[c]>0));while(key.length<KL)key+=pick(unowned.length?unowned:pool);key=[...key].sort(()=>Math.random()-.5).join('')}else for(let i=0;i<KL;i++)key+=pick(pool);S.geneKey=key;S.keyUsed=false;
 const us=unlockedSpecies();const gs=pick(us);
 if(!S.goldRush||S.goldRush.done||!S.goldRush.posted)newGoldRush();

 for(let i=0;i<16;i++){const sid=pick(all);const t=weighted(TIER_W.map((w,ti)=>[ti,ti>=3&&ti<=8?w*1.6:w]));
  S.board.push({who:pick(NPCS),sid,tier:t,hp:Math.round(SPECIES[sid].hp*TIER_HP[t]*rand(.85,1.15)),area:areaOf(sid),at:Date.now()-randi(1,23)*3600e3-randi(0,59)*60e3})}
 // weekly tournament

 if(!S.week||S.week.wk!==wk){

function weekStandings(){const rows=S.week.rivals.map(r=>({name:r.name,score:r.score}));rows.push({name:S.name,score:weekScore(),you:true});return rows.sort((a,b)=>b.score-a.score)}

function skillGrip(el){return clamp((S.skills[el]*5+skillTotal()*.8)/(50+ELEMENTS.length*10*.8),0,1)} // 0 = no training, 1 = everything maxed

function fightPower(el,bait){const buffs=S.exp?S.exp.buffs:{};const parts=[['Base',8],[EL[el].name+' skill',S.skills[el]*5],['All skills',Math.round(skillTotal()*.8)],['Bait quality',bait?B(bait).r*2:0]];if(masteryRank(el))parts.push([EL[el].name+' mastery',masteryRank(el)*3]);
 if(buffs.warcry)parts.push(['War Cry',10]);return{total:parts.reduce((s,p)=>s+p[1],0),parts}}
const LIKE_MULT=[1,1.7,3,5.5]; // bite boost for 0,1,2,3 liked qualities on one bait
function affinity(sp,bait){const d=bait;/* sp.bs = the bait size this creature prefers */const sizeMul=[1.5,.85,.45,.2,.1][Math.abs(sp.bs-d.s)];const hits=d.q.filter(i=>sp.likes.includes(i)).length;const dis=d.q.some(i=>sp.dislike.includes(i));
 return(sp.diet[d.g]||.04)*sizeMul*(1+.1*d.r)*LIKE_MULT[Math.min(hits,3)]*(dis?.45:1)*(1+.04*S.skills[sp.el])}

const TRAVEL={
 stride:{n:'Swift Stride',max:5,cost:l=>Math.round(120*Math.pow(1.9,l)),d:'Each level cuts 2 minutes off every move between areas (12 min down to 2).'},

function startExpedition(ri){
 S.exp={region:ri,area:0,clock:EXP_MINUTES,tank:[],log:[],buffs:S.buffs||{},trap:null,fight:null,alert:null,bag:bagPick()};S.buffs={};S.stats.trips++;

function maxTrap(){const e=S.exp;return e?Math.max(1,Math.min(10,e.clock-1)):10}
function logx(t,hi){S.exp.log.unshift({t,hi});S.exp.log=S.exp.log.slice(0,30)}
/* ---- body clock: how long the walk back to the gate takes, and how much time is spare after it ---- */
function fmtMins(m){m=Math.max(0,Math.round(m));return m<60?m+' min':fmtClock(m)}
function backCost(e){e=e||S.exp;return e&&e.area?moveCost(e.area,0):0}
function spareMin(e){e=e||S.exp;return e?e.clock-backCost(e):0}
function bodyState(e){const sp=spareMin(e);return sp<=5?'crit':sp<=20?'warn':sp<=45?'low':''}
function fieldClockText(e){const b=backCost(e),sp=e.clock-b;return e.area?`${fmtClock(e.clock)} left · gate ${b}m away · ${sp>0?fmtMins(sp)+' spare':'<b>LEAVE NOW</b>'}`:`${fmtClock(e.clock)} left · at the gate`}

function shopSorted(){const rows=S.shop.map((d,i)=>[d,i]);const so=UI.shopSort;if(!so)return rows;

const SCALES=[()=>SIZES,()=>RARITY,()=>TIERS];
function expandTerm(t){ // returns an array of accepted values, or null if t is plain text
 const plus=t.match(/^(.+?)\s*\+$/);
 for(const sc of SCALES){const L=sc().map(x=>x.toLowerCase());
  if(plus){const i=L.indexOf(plus[1].trim());if(i>=0)return L.slice(i)}
  for(let k=1;k<t.length;k++){if(t[k]!=='-')continue;const a=L.indexOf(t.slice(0,k).trim()),b=L.indexOf(t.slice(k+1).trim());
   if(a>=0&&b>=0)return L.slice(Math.min(a,b),Math.max(a,b)+1)}
  const lo=t.match(/^(.+?)\s*-$/),hi=t.match(/^-\s*(.+)$/);if(lo){const i=L.indexOf(lo[1].trim());if(i>=0)return L.slice(i)}if(hi){const i=L.indexOf(hi[1].trim());if(i>=0)return L.slice(0,i+1)}}
 return null}
function searchBox(id){const v=(UI.tq||{})[id]||'';return`<div class="row" style="margin-bottom:8px"><input type="text" data-bq="${id}" id="bq-${id}" placeholder="Search: arcane/flesh, small-large, rare+ … (commas combine)" value="${esc(v)}" style="flex:1 1 260px;max-width:420px" aria-label="Search baits"><button type="button" class="btn small" data-bqclear="${id}">Clear</button><span class="muted" style="font-size:13px" data-bqc="${id}"></span></div>`}
function cellKey(td){const cb=td.querySelector('input[type=checkbox]');if(cb)return cb.checked?0:1; // bookmarked first
 const t=td.innerText.trim();const ri=RARITY.indexOf(t);if(ri>=0)return ri;const si=SIZES.indexOf(t);if(si>=0)return si;
 const n=t.replace(/[$,]/g,'').match(/^-?\d+(\.\d+)?/);return n?parseFloat(n[0]):t.toLowerCase()}
function applyBaitTable(id){const t=document.querySelector(`table[data-bt="${id}"],table[data-bs="${id}"]`);if(!t||!t.tBodies[0])return;
 const st=(UI.tsort||{})[id];const body=t.tBodies[0];const rows=[...body.rows].filter(r=>r.cells.length>1);
 if(st&&t.dataset.bt){const heads=[...t.tHead.rows[0].cells].map(h=>h.dataset.label||h.textContent.trim());const nc=heads.indexOf('Bait');
  const name=r=>nc>=0?r.cells[nc].innerText.trim().toLowerCase():'';
  rows.sort((a,b)=>{const x=cellKey(a.cells[st.c]),y=cellKey(b.cells[st.c]);const d=(x<y?-1:x>y?1:0)*st.dir;return d||name(a).localeCompare(name(b))}).forEach(r=>body.appendChild(r))}
 // comma-separated terms must ALL match; a term equal to a whole value (e.g. "rare") matches only that value
 const terms=((UI.tq||{})[id]||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);let shown=0;
 const toks=r=>{const out=[];[...r.cells].forEach(c=>{out.push(c.innerText.trim().toLowerCase());c.querySelectorAll('.chip').forEach(ch=>out.push(ch.innerText.trim().toLowerCase()))});return out};
 const rowToks=rows.map(toks);const alts=terms.map(t=>t.split('/').map(x=>x.trim()).filter(Boolean)); // "/" means either: arcane/flesh
 const exact=new Set(alts.flat().filter(t=>rowToks.some(tk=>tk.includes(t))));
 const hit=(t,tk,txt)=>{const rg=expandTerm(t);return rg?rg.some(v=>tk.includes(v)):exact.has(t)?tk.includes(t):txt.includes(t)};
 rows.forEach((r,ri)=>{const tk=rowToks[ri],txt=r.innerText.toLowerCase();const ok=alts.every(a=>!a.length||a.some(t=>hit(t,tk,txt)));r.hidden=!ok;if(ok)shown++});
 const c=document.querySelector(`[data-bqc="${id}"]`);if(c)c.textContent=terms.length?`${shown} of ${rows.length}`:''}
function enhanceBaitTables(){
 document.querySelectorAll('table[data-bt]').forEach(t=>{const id=t.dataset.bt;const st=(UI.tsort||{})[id];
  [...t.tHead.rows[0].cells].forEach((th,ci)=>{if(th.hasAttribute('data-nosort')||!th.textContent.trim())return;
   const label=th.dataset.label||(th.dataset.label=th.textContent.trim());const on=st&&st.c===ci;th.setAttribute('aria-sort',on?(st.dir>0?'ascending':'descending'):'none');
   th.innerHTML=`<button class="sorth" type="button">${esc(label)} ${on?(st.dir>0?'▲':'▼'):'<span style="opacity:.4">↕</span>'}</button>`;
   th.firstChild.addEventListener('click',()=>{UI.tsort=UI.tsort||{};const cur=UI.tsort[id];UI.tsort[id]=cur&&cur.c===ci?{c:ci,dir:-cur.dir}:{c:ci,dir:1};enhanceBaitTables()})});
  applyBaitTable(id)});
 document.querySelectorAll('table[data-bs]').forEach(t=>applyBaitTable(t.dataset.bs));
 document.querySelectorAll('input[data-bq]').forEach(inp=>{if(inp._wired)return;inp._wired=1;inp.addEventListener('input',()=>{UI.tq=UI.tq||{};UI.tq[inp.dataset.bq]=inp.value;applyBaitTable(inp.dataset.bq)})});
 document.querySelectorAll('button[data-bqclear]').forEach(btn=>{if(btn._wired)return;btn._wired=1;btn.addEventListener('click',()=>{const id=btn.dataset.bqclear;const inp=document.getElementById('bq-'+id);UI.tq=UI.tq||{};UI.tq[id]='';if(inp){inp.value='';inp.focus()}applyBaitTable(id)})})}

function vSystem(){const t=UI.tab.system;let body='';

 else if(t==='mine'){body=`<h2>My records</h2><p class="muted" style="margin-top:-6px">Bestiary title: <b>${natTitle()}</b></p><div class="grid3" style="margin-bottom:16px">${[['Souls captured',S.stats.caught],['Escaped',S.stats.lost],['Hunts',S.stats.trips],['Earned',money(S.stats.earned)]].map(([l,v])=>`<div class="box"><div class="eyebrow">${l}</div><div style="font-family:var(--f-display);font-size:24px">${v}</div></div>`).join('')}</div>

 else if(t==='global'){netRecords();const g=S.board.filter(r=>!r.you).concat(S.records.map(r=>({who:S.name,sid:r.sid,tier:r.tier,hp:r.hp,area:r.area,ago:0,you:true}))).sort((a,b)=>b.hp-a.hp);
  const all=UI.recAll;const live=all?NET.recordsAll:NET.records;

 else{body=`<h2>Game</h2><div class="grid2"><div class="box"><h3>About this prototype</h3><p style="font-size:14px">A remake of the mechanics of <i>Monster Hunter X</i> (Red Shade Games, 2009), a browser game rebuilt from its archived 1.0 manual. Everything here is original: names, areas, art and numbers. Features are trapping with bait from 8 groups and 210 sub-qualities, 500 souls across 48 regions, the pull, push and release fight with a danger meter, 4-hour dimension trips through gates, the 5-slot Soul Tank, elemental equipment, region unlocks, bait bookmarking, the P2P market, gene synthesis, the Gold Rush, weekly tournaments and the top catches board.</p>
  <p style="font-size:14px"><b>Live with other hunters:</b> the Hunters' market, global catch records, the Gold Rush, the shared caches and the weekly Guild ledger are played with real people. When the server can't be reached, the Temple's own traders and records stand in.</p>

  <h3 style="margin-top:14px">Privacy</h3><p style="font-size:13px">Other hunters can see your hunter name, your country, your catches and your market listings. Your country is worked out from your connection when you play; your IP address is not stored. Nothing else about you is collected unless you sign in with Google, which stores your email address with your save. There are no ads and no tracking. <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a> · <a href="terms.html" target="_blank" rel="noopener">Terms</a></p>
  <h3 style="margin-top:14px">Credits</h3><p class="muted" style="font-size:13px">Headings use <b>Pixelbasel</b> © 2025 GGBotNet, under the SIL Open Font License 1.1. Sound effects by Kenney and artisticDude (CC0). Music: "Minstrel Dance" and "The Old Tower Inn" by RandomMind, "Abandoned Passages" by congusbongus, "Horror Loop" by TinyWorlds (all CC0, via OpenGameArt). Creature, region, bait, chest and icon art made for Soulgate. Flags from flagcdn.com.</p></div>
  <div class="box"><h3>Your hunter</h3><div class="authbox" style="margin-bottom:14px">${authBox()}</div><label for="rename" style="display:block;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)">Hunter name, seen by other hunters</label><div class="namebox"><input type="text" id="rename" maxlength="18" value="${esc(S.name)}" autocomplete="off"><button class="btn primary" data-act="rename">Change name</button></div><p class="muted" style="font-size:12px;margin:6px 0 0">2–18 letters, numbers or spaces. Names are unique; you can change yours every 10 minutes.</p>

  <h3 style="margin-top:16px">Online data</h3>${S.netOff?`<p style="font-size:14px">You are playing offline: nothing is sent to the server.</p><button class="btn" data-act="netback">Go online again</button>`:`<p style="font-size:13px;margin:0 0 8px">Erase your hunter name, catches, market listings, cloud save and Google sign-in from the server. Your progress in this browser stays, and you keep playing offline. <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a> · <a href="terms.html" target="_blank" rel="noopener">Terms</a></p><button class="btn danger" data-act="delme1">Delete my online data</button><div id="delconfirm"></div>`}<label for="vol" style="display:block;margin:6px 0">Volume</label><input type="range" id="vol" min="0" max="1" step=".05" value="${S.vol==null?.8:S.vol}" style="width:100%"><label for="musicvol" style="display:block;margin:10px 0 6px">Music</label><input type="range" id="musicvol" min="0" max="1" step=".05" value="${musicVol()}" style="width:100%"><p class="muted" style="font-size:12px;margin:6px 0 0">Music: "Minstrel Dance" and "The Old Tower Inn" by RandomMind, "Abandoned Passages" by congusbongus, "Horror Loop" by TinyWorlds (all CC0, via OpenGameArt).</p><label style="display:block;margin-top:12px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)"><input type="checkbox" data-act="autochaff" ${S.autoChaff?'checked':''}> <b>Quick-fight small fry</b>: Weakling and Standard catches of species you have caught 10+ times are fought for you instantly, reading the stance.</label><div class="row" style="margin-top:10px"><button class="btn danger" data-act="reset1">Start over</button></div><div id="resetconfirm"></div></div></div>`}

function keepScore(m){const gr=S.goldRush;return (gr&&!gr.done&&m.sid===gr.sid&&m.tier>=gr.minTier?1e9:0)+m.tier*1e6+m.value}

const AUTO_MIN_CLOCK=20;      // stop with this many dimension minutes left so you can walk back to the gate

  stats:{traps:0,bites:0,caught:0,escaped:0,released:0},started:e.clock};

  if(e.clock<autoReserve()&&!e.fight&&!e.alert){stopMsg=`only ${e.clock} minutes left, just enough to walk back to the gate (${moveCost(e.area,0)} min).`;break}
  if(e.alert){A.stats.bites++;UI.screen='watch';engage();if(A.handoff>=0&&e.fight&&e.fight.tier>=A.handoff){stopMsg=`a <b>${TIERS[e.fight.tier]} ${SPECIES[e.fight.sid].name}</b> is on the line. It's yours to fight.`;good=true;A.handed=true;break}continue}

  UI.screen='watch';tickSec();budget--;}
 }finally{render=realRender;UI.screen='auto'}

function vFight(){const e=S.exp,f=e.fight;const sp=SPECIES[f.sid];const bait=S.baits.find(b=>b.uid===f.baitUid);const fp=fightPower(sp.el,bait);
 const pct=f.hp/f.maxhp*100;const P=pullPower(f,fp.total);f.oddsView=true;const rs=resistChance(f,P);f.oddsView=false;const dm=Math.round(P*1.1*FIGHT.dangerDmg[f.danger]*FIGHT.stanceDmg[f.hidden?'steady':(f.stance||'steady')]*(sp.el==='flame'?1+.2*sigMul(f):1)*(f.plates>0?.5:1));
 const st=f.hidden?{n:'Unreadable',c:'#9ea5b8',d:'hidden in shadow'}:STANCE[f.stance||'steady'];
 const chips=[];if(f.plates>0)chips.push(`${f.plates} plate${f.plates>1?'s':''} left`);if(sp.el==='frost')chips.push(`numb in ${3-((f.pulls||0)%3)} pull${3-((f.pulls||0)%3)>1?'s':''}`);if(f.tier>=GODLY)chips.push('<b style="color:#fff">GODLY: element three times as strong, endurance maxed, always frenzied</b>');else if(f.tier>=10)chips.push('Perfect: element twice as strong');if(f.temper==='frenzied'&&f.tier>=9)chips.push('frenzied');if(f.migrant)chips.push('travel-worn');if((f.streak||0)>=4&&f.end>=85)chips.push('<b style="color:#ff7a7a">about to tear free</b>');if(f.pulls>40)chips.push('tiring');

 <div class="dmeter" aria-label="Danger level">${DANGER.map((d,i)=>`<span class="${i===f.danger?'on':''}" style="--dc:${d.c}">${d.n} <small><i class="lg">1 in </i><i class="sm">1/</i>${d.odds}</small></span>`).join('')}</div>

 <div class="grid3" style="text-align:left"><div class="box"><div class="eyebrow">Level</div><div style="font-family:var(--f-display);font-size:24px">${m.lvl}</div></div><div class="box"><div class="eyebrow">Hit points</div><div style="font-family:var(--f-display);font-size:24px">${m.maxhp}</div></div><div class="box"><div class="eyebrow">Value</div><div style="font-family:var(--f-display);font-size:24px;color:var(--gold)">${money(m.value)}</div></div></div>
 <p style="margin:14px auto">${sp.note}</p>

 ${L.rested?'<p style="font-size:14px;color:var(--soul)"><b>Well-rested:</b> +50% on this cash-in.</p>':''}${(L.guild||[]).map(x=>`<div class="msg" style="border-left-color:var(--gold);margin-top:8px">${x}</div>`).join('')}${L.rows.some(r=>r.quota)?`<p class="muted" style="font-size:13px">Gate quota: past ${GATE_QUOTA} of one species today, the lowest-tier extras paid half.</p>`:''}${L.offer?`<p style="font-size:14px">Today's first cash-in offering: an <span class="r-1">Uncommon</span> ${L.offer.g} bait, <b>${esc(L.offer.n)}</b>.</p>`:''}${L.grPending?`<div class="box" style="margin-top:12px;border-color:var(--gold)"><h3>Gold Rush: checking with the Temple…</h3><p>Your ${SPECIES[(S.grClaim||{}).sid||S.goldRush.sid].name} qualifies. Confirming you got there before every other hunter.</p></div>`:''}${L.grLost?`<div class="box" style="margin-top:12px"><h3>Beaten to the Gold Rush</h3><p><b>${esc(L.grLost.who||'Another hunter')}</b> claimed it first. Consolation: <b>${money(L.grLost.pay)}</b>.</p></div>`:''}${L.grHit?`<div class="box" style="margin-top:12px"><h3>You won the Gold Rush</h3><p>You earned <b style="color:var(--gold)">${money(L.grPay||50)}</b> and <b style="color:var(--gold)">1 bonus point</b>.</p>${L.grHit&&!L.cacheHit&&!grKeyOk()?'<p class="muted" style="font-size:13px">Gold Rush keys are capped at 2 a day; this one paid money only.</p>':''}${L.cacheHit?`${L.cacheFirst?'<p style="color:var(--gold);font-weight:700;font-family:var(--f-body);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em">Secret unlocked: the Temple caches.</p>':''}<p style="color:var(--gold);font-weight:700">Your Gold Rush soul was ${TIERS[(L.rows.find(r=>r.m.sid===L.gr.sid&&r.m.tier>=9)||{m:{tier:9}}).m.tier]}, so you earned a cache key!</p><button class="btn gold" data-act="tocache">Open the caches</button>`:''}</div>`:''}

 ${L.weekWin?`<div class="box" style="margin-top:12px;border-color:var(--gold)"><h3>${L.cacheFirst?'Secret unlocked':'Weekly tournament won'}</h3><p>${L.cacheFirst?'Winning the weekly tournament revealed the Temple caches. You earned a key.':'You won the weekly tournament and earned a cache key.'}</p><button class="btn gold" data-act="tocache">Open the caches</button></div>`:''}
 ${L.perfectKeys?`<div class="box" style="margin-top:12px;border-color:var(--crit)"><h3 style="color:#ff7a7a">${L.perfectFirst?'Secret unlocked: a Perfect soul':'Perfect soul cashed in'}</h3><p>${L.perfectFirst?'A Perfect catch revealed the Temple caches. ':''}You earned ${L.perfectKeys>1?L.perfectKeys+' cache keys':'a cache key'}.</p><button class="btn gold" data-act="tocache">Open the caches</button></div>`:''}

 ${UI.goalsSeen===L.id?`<details class="goalsd"><summary>Next goals</summary>${nextGoalsHtml()}</details>`:nextGoalsHtml()}</div>`}
function nextGoalsHtml(){const g=[];const nextR=REGION_ORDER.find(ri=>!S.regions[ri]&&S.regions[regionPrev(ri)]);
 if(nextR!=null){const c=REGIONS[nextR].cost;g.push([S.money>=c?`Unlock ${REGIONS[nextR].name} · <b style="color:var(--soul)">Ready in Equipment</b>`:'Unlock '+REGIONS[nextR].name,`${money(Math.min(S.money,c))} / ${money(c)}`,S.money/c])}
 const caught=Object.keys(S.bestiary).length;g.push(['Bestiary',`${caught} / ${Object.keys(SPECIES).length} species`,caught/Object.keys(SPECIES).length]);
 const need={};(S.geneKey||'').split('').forEach(ch=>need[ch]=(need[ch]||0)+1);const have=Object.entries(need).reduce((a,[ch,n])=>a+Math.min(n,S.genes[ch]||0),0),tot=(S.geneKey||'').length||1;
 if(!S.keyUsed)g.push([`Today's Gene Key (${S.geneKey})`,`${have} / ${tot} letters`,have/tot]);
 g.push(['Misfortune → cache key',`${S.misfortune||0} / ${MISFORTUNE_PER_KEY}`,(S.misfortune||0)/MISFORTUNE_PER_KEY]);
 if(typeof guildGoals==='function')guildGoals().forEach(x=>g.push(x));
 if(typeof contractsGoals==='function')contractsGoals().forEach(x=>g.push(x));
 return`<div class="box" style="margin-top:14px"><h3>Next goals</h3><div class="goals">${g.slice(0,6).map(([n,v,f])=>`<div class="goal"><span>${n}</span><span class="gv">${v}</span><div class="bar"><i style="width:${Math.round(clamp(f,0,1)*100)}%"></i></div></div>`).join('')}</div></div>`}

function cashCountUp(){const el=$('#cashtotal');const L=S.lastCash;if(!el||!L||UI.cashSeen===L.id){if(L)UI.goalsSeen=L.id;return}UI.cashSeen=L.id;UI.goalsSeen=L.id;const tot=+el.dataset.total,rows=+el.dataset.rows;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce||!rows){el.textContent=money(tot);return}
 const done=()=>{UI.cashPending=0;const tb=$('#topbal');if(tb){tb.textContent=money(S.money);tb.classList.add('flash');setTimeout(()=>tb.classList.remove('flash'),500)}};UI.cashPending=tot;const tb0=$('#topbal');if(tb0)tb0.textContent=money(S.money-tot);setTimeout(()=>{if(UI.cashPending)done()},8000);
 for(let i=0;i<rows;i++)setTimeout(()=>sfx.tick(i),300+i*350);const dur=300+rows*350+300,t0=performance.now();
 const step=t=>{const k=clamp((t-t0)/dur,0,1);el.textContent=money(tot*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);else{sfx.coin();done()}};requestAnimationFrame(step)}

  S.pendingDay=false;if(!S.autoSellV){(S.baits||[]).forEach(b=>b.keep=true);S.autoSellV=1}catchUpDays();if(S.goldRush&&S.goldRush.minTier<9)S.goldRush.minTier=9;if(!S.goldRush||!S.goldRush.posted||S.goldRush.done)newGoldRush();npcGoldRush();if(S.shop&&new Set(S.shop.map(b=>b.base)).size<S.shop.length){fillShop();save()}}
 if(S){S.stats=S.stats||{trips:0,caught:0,lost:0};S.board=S.board||[];S.news=S.news||[];S.bookmarks=S.bookmarks||[];S.genes=S.genes||{};S.bestiary=S.bestiary||{};S.seen=S.seen||{};S.skills=S.skills||{};ELEMENTS.forEach(x=>S.skills[x.id]=S.skills[x.id]||0);S.baits=(S.baits||[]).filter(b=>b&&b.base&&b.q)}
 if(S){TANK_MAX=5+(S.slots||0);if(!S.contracts||S.contracts.day!==S.day)newContracts()}
 if(S){if(away0>=24*3600e3&&!(S.exp&&S.exp.tank&&S.exp.tank.length)){S.rested=Date.now()+4*3600e3}try{guildTick()}catch(_){}}
 if(S&&away0>30*60e3){const L=[];if(restedMul()>1)L.push('<b>Well-rested:</b> you were away a day or more, so cash-ins pay +50% for the next 4 hours.');const h=Math.round(away0/3600e3);L.push(`You were away for ${h>=1?h+' hour'+(h>1?'s':''):Math.round(away0/60e3)+' minutes'}. Gold Rush rivals paused while you were gone.`);if(S.day!==snap0.day)L.push(`${S.day-snap0.day>1?S.day-snap0.day+' new days':'A new day'} began: new contracts, Gene Key <b>${esc(S.geneKey)}</b>, shop and market.`);const W=world();const vis=W.visitor;if(vis)L.push(`Visitor today: ${an(SPECIES[vis.sid].name)} in ${esc(REGIONS[vis.ri].areas[vis.ai].n)}.`);if(S.goldRush)L.push(`Gold Rush target: <b>${SPECIES[S.goldRush.sid].name}</b> (${money(grPay())}).`);if(S.week){const g=weekGap();L.push(g?`Tournament: #${g.rank+1}, ${g.gap.toLocaleString()} HP behind ${esc(g.name)}.`:weekScore()>0?'Tournament: you still lead.':'Tournament: no entry yet this week.')}const lastSeen=Date.now()-away0;(S.news||[]).filter(n=>n.at&&n.at>lastSeen).slice(0,4).forEach(n=>L.push(n.t));UI.away=L}
 if(!S){UI.screen='intro'}
 else if(S.exp){ // resume in the field
  if(S.exp.fight)UI.screen='fight';else if(S.exp.alert)UI.screen='watch';else{if(S.exp.trap&&!S.exp.alert){S.exp.trap=null}UI.screen='hunt'}}
 else if(UI.screen==='intro'||!UI.screen)UI.screen='temple';
 render();setTimeout(async()=>{await netInit();if(AUTH.tok)authSync()},600);authSettings().then(()=>{if(['system','intro'].includes(UI.screen))render()});}
setInterval(()=>{if(!S)return;const cd=fmtCountdown(untilMidnight());const c=document.getElementById('clock');if(c)c.textContent=cd;document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=cd);
 const beat=npcGoldRush();if(beat){toast(`${esc(beat)} won the Gold Rush. New quest: ${SPECIES[S.goldRush.sid].name}.`);if(UI.screen==='temple')render()}
 if(catchUpDays()){toast('A new day has begun: new market listings and Gene Key.');if(['watch','fight'].includes(UI.screen))renderTop();else render()}},1000);
